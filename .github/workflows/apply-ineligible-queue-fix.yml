name: Apply guarded ineligible queue fix

on:
  push:
    branches:
      - fix/remove-denver-queue-note-20260910
    paths:
      - .github/workflows/apply-ineligible-queue-fix.yml

permissions:
  contents: write

concurrency:
  group: apply-ineligible-queue-fix-20260910
  cancel-in-progress: false

jobs:
  apply-patch:
    if: github.repository == 'warren2314/gmcl' && github.ref == 'refs/heads/fix/remove-denver-queue-note-20260910'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out this feature-branch commit only
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Apply three exact source replacements
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path

          path = Path('internal/httpserver/admin_ineligible.go')
          raw = path.read_bytes()
          actual = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
          expected = '5f1c609ea184caa0a39af92350506c4307b9e4a6'
          if actual != expected:
              raise SystemExit(f'Aborting: source blob {actual} differs from reviewed {expected}')
          source = raw.decode('utf-8')

          def replace_once(old, new):
              global source
              matches = source.count(old)
              if matches != 1:
                  raise SystemExit(f'Aborting: expected exactly one source marker, found {matches}: {old!r}')
              source = source.replace(old, new, 1)

          replace_once(
              '''\tcase "new_replies":\n\t\treturn alias + ".source_type='ineligible_player' AND EXISTS''',
              '''\tcase "new_replies":\n\t\treturn ineligibleCaseGroupPredicate("live", alias) + " AND EXISTS''',
          )
          replace_once(
              '''\t}\n\tswitch filter.ReplyStatus {\n\tcase "unreviewed":''',
              '''\t}\n\t// Finished cases belong in history, not the selected, assigned or reply queues.\n\t// Explicit status searches remain available for examining completed work.\n\tif filter.CaseStatus == "" && (filter.State == "" || filter.State == "open" || filter.Scope == "mine" || filter.ReplyStatus == "unreviewed") {\n\t\twhere = append(where, "(c.id IS NULL OR c.status NOT IN ('published','closed','rejected','withdrawn'))")\n\t}\n\tswitch filter.ReplyStatus {\n\tcase "unreviewed":''',
          )
          replace_once(
              "intake.linked_case_status<>'withdrawn'",
              "intake.linked_case_status NOT IN ('published','closed','rejected','withdrawn')",
          )
          path.write_bytes(source.encode('utf-8'))
          PY

      - name: Format changed Go files and check the patch
        run: |
          gofmt -w internal/httpserver/admin_ineligible.go internal/httpserver/admin_ineligible_closed_queue_test.go internal/httpserver/admin_ineligible_worklanes.go internal/httpserver/admin_ineligible_worklanes_test.go
          git diff --check
          git diff --stat
          git diff -- internal/httpserver/admin_ineligible.go

      - name: Commit only the reviewed files back to the feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- internal/httpserver/admin_ineligible.go internal/httpserver/admin_ineligible_closed_queue_test.go internal/httpserver/admin_ineligible_worklanes.go internal/httpserver/admin_ineligible_worklanes_test.go
          git commit -m 'fix: exclude finished cases from active and new-reply queues'
          git push origin HEAD:refs/heads/fix/remove-denver-queue-note-20260910
